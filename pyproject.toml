[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vega-the-language"
version = "0.1.0"
description = "The Vega programming language"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["click>=8.1,<9"]

[project.scripts]
vega = "cli.vegapy:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["cli", "cli.*", "src", "src.*"]
